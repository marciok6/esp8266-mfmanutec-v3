; =============================================================
; PlatformIO Project Configuration – MFMANUTEC IoT v3
; =============================================================
; Compatível com NodeMCU v2/v3 (ESP-12E/F) e ESP-12F genérico.
; Para compilar: pio run
; Para upload:   pio run --target upload
; Para monitor:  pio device monitor
; =============================================================

[env:nodemcuv2]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
monitor_speed = 115200

; Tamanho do filesystem LittleFS (2 MB FS, 2 MB sketch)
board_build.filesystem  = littlefs
board_build.flash_mode  = dout
board_build.f_cpu        = 80000000L

; Opções do compilador
build_flags =
    -D NDEBUG
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ADC_MODE=ADC_VCC    ; Lê tensão interna via ESP.getVcc()

; Dependências de bibliotecas
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9

; Upload via porta serial (altere a porta conforme seu SO)
; upload_port = /dev/ttyUSB0  ; Linux
; upload_port = COM3           ; Windows

; OTA upload (opcional)
; upload_protocol = espota
; upload_port     = 192.168.x.x

[env:esp12f]
extends       = env:nodemcuv2
board         = esp12e
